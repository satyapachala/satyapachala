# 💫 About Me:
I am an MCA graduate and a fresher with a strong interest in software development and data engineering. I have knowledge of Python, Java, SQL, HTML, and PySpark.<br><br>I have worked on an E-Commerce Analytics project using PySpark, Python, SQL, Flask, JavaScript, and Parquet. In this project, I worked on data extraction, transformation, processing, and analytics, and also connected the backend with the frontend to build a dashboard.<br><br>I am a quick learner and enjoy solving technical problems and learning new technologies. I am looking for an entry-level opportunity where I can apply my technical skills, gain real-world experience, and contribute to the organization.<br><br>My goal is to start my career in a good organization and continuously improve my technical and professional skills.<br>


